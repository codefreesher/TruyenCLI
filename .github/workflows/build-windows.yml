name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag cần tạo/cập nhật Release, ví dụ v1.0.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name TruyenCLI
          --collect-all googleapiclient
          --collect-all google_auth_oauthlib
          --collect-all google.oauth2
          --collect-all browser_cookie3
          --hidden-import _curses
          main.py

      - name: Smoke test
        run: .\dist\TruyenCLI.exe sources

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TruyenCLI-windows
          path: dist/TruyenCLI.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $null = gh release view "$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "dist/TruyenCLI.exe#TruyenCLI.exe" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "dist/TruyenCLI.exe#TruyenCLI.exe" --title "$env:RELEASE_TAG" --generate-notes
          }
